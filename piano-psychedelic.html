<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#E8ECF4; --ink:#141A33; --muted:#586180;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#10152A;--ink:#EEF1FB;--muted:#9AA4C6}
}
:root[data-theme="dark"]{--paper:#10152A;--ink:#EEF1FB;--muted:#9AA4C6}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font:500 1rem/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
body.noscroll{overflow:hidden}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:3px}
.qmodal :focus-visible,.why :focus-visible{outline-color:var(--bg)}

/* ---------- home ---------- */
#home{min-height:100dvh;display:flex;flex-direction:column}
.homebar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:clamp(18px,3vw,36px) clamp(14px,3vw,36px) clamp(12px,2vw,22px)}
.homebar h1{margin:0;font-size:clamp(2rem,5.4vw,4.2rem);font-weight:800;line-height:.98;letter-spacing:-.03em;max-width:22ch}
.grid{
  flex:1;display:grid;gap:clamp(10px,1.6vw,18px);
  padding:0 clamp(14px,3vw,36px) clamp(14px,3vw,36px);
  grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(200px,28vh);
}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(210px,1fr));grid-auto-rows:auto}}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr);grid-auto-rows:minmax(190px,26vh)}}
.tile{
  position:relative;border:0;padding:0;border-radius:30px;overflow:hidden;cursor:pointer;text-align:left;
  background:var(--tc);color:var(--tf);
  animation:tileIn .8s cubic-bezier(.2,1.25,.3,1) both;animation-delay:calc(var(--i)*80ms);
  transition:transform .4s cubic-bezier(.3,1.5,.5,1),box-shadow .3s;
}
.tile:hover,.tile:focus-visible{transform:translateY(-6px) scale(1.03)}
.tile:active{transform:scale(.98)}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.tile .lab{position:absolute;left:clamp(16px,2vw,26px);bottom:clamp(14px,2vw,24px);right:70px}
.tile .lab b{display:block;font-size:clamp(1.5rem,3vw,2.5rem);font-weight:800;line-height:1;letter-spacing:-.02em}
.tile .lab span{display:block;margin-top:6px;font-size:clamp(.9rem,1.3vw,1.05rem);opacity:.85}
.tile .go{
  position:absolute;right:clamp(14px,2vw,22px);bottom:clamp(14px,2vw,22px);width:46px;height:46px;border-radius:50%;
  background:var(--tf);color:var(--tc);display:grid;place-items:center;transition:transform .4s cubic-bezier(.3,1.6,.5,1);
}
.tile:hover .go,.tile:focus-visible .go{transform:rotate(-45deg) scale(1.12)}
@keyframes tileIn{from{opacity:0;transform:translateY(40px) scale(.8) rotate(-4deg)}to{opacity:1}}

/* ---------- shared bits ---------- */

/* ---------- stage ---------- */
.stage{
  position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  --g:clamp(20px,5vw,96px);--capfs:clamp(1.5rem,3.6vw,2.9rem);
  background:var(--bg);color:var(--fg);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  clip-path:circle(0px at var(--cx,50%) var(--cy,50%));visibility:hidden;
  transition:clip-path .5s cubic-bezier(.7,0,.2,1),visibility 0s .5s,background-color .5s;
  overflow:hidden;overflow:clip;
}
.stage.open{clip-path:circle(170vmax at var(--cx,50%) var(--cy,50%));visibility:visible;transition:clip-path .7s cubic-bezier(.7,0,.2,1),visibility 0s,background-color .5s}
.stage .fade{transition:opacity .2s}
.stage.swap .fade{opacity:0}
.bar{display:flex;align-items:center;gap:10px;padding:12px var(--g)}
.bar .title{font-weight:800;font-size:1.2rem;letter-spacing:-.01em;margin:0 auto 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;justify-content:center;padding:0 16px;
  border:2px solid var(--fg);border-radius:999px;background:transparent;color:var(--fg);font-weight:700;cursor:pointer;
  transition:background .2s,color .2s;
}
.pill:hover,.pill[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.pill svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill.icon{padding:0;width:44px}
@media (max-width:560px){.pill .t{display:none}.pill.home{padding:0;width:44px}.bar .title{font-size:1.05rem}}
.viz{position:relative;flex:1;min-height:0}
.viz canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.dock{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px 32px;align-items:end;padding:6px var(--g) 10px}
@media (max-width:760px){.dock{grid-template-columns:minmax(0,1fr)}}
.capwrap{display:flex;flex-direction:column;justify-content:flex-end;min-height:calc(var(--capfs)*2.16 + 58px)}
.cap{margin:0;font-size:var(--capfs);font-weight:760;line-height:1.08;letter-spacing:-.02em;max-width:20ch}
.cap.in{animation:capIn .5s cubic-bezier(.2,1,.3,1)}
@keyframes capIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:14px;font-weight:750;font-size:clamp(.95rem,1.8vw,1.2rem)}
.eq span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:4px 16px;border-radius:999px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.eq .m{border:2px solid var(--fg)}
.eq .a{background:var(--fg);color:var(--bg);border:2px solid var(--fg);animation-delay:.12s}
.eq .sep{padding:0;min-height:0;font-size:1.5em;font-weight:800;animation-delay:.06s}
.eq .ic{opacity:.7;font-weight:800;font-style:normal}
.ctls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;min-height:44px}
.ctl{display:none}
.ctl.show{display:inline-flex;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(12px)}to{opacity:1;transform:none}}
.chip{
  min-height:44px;padding:8px 18px;border:2px solid var(--fg);border-radius:999px;background:transparent;color:var(--fg);
  font-weight:700;font-size:1rem;cursor:pointer;align-items:center;transition:background .15s,color .15s,transform .15s;
}
.chip:hover,.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip:active{transform:scale(.94)}
.slider{align-items:center;gap:12px;font-weight:700}
.slider input{width:min(280px,56vw);height:36px;accent-color:var(--acc)}
.slider output{min-width:4.5em;font-variant-numeric:tabular-nums}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--g) 14px}
.nbtn{
  min-height:52px;padding:0 22px;border-radius:999px;border:2px solid var(--fg);background:transparent;color:var(--fg);
  font-weight:800;font-size:1.05rem;display:inline-flex;align-items:center;gap:10px;cursor:pointer;transition:transform .2s,background .2s,color .2s;
}
.nbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.nbtn.primary{background:var(--fg);color:var(--bg)}
.nbtn:disabled{opacity:.3;cursor:not-allowed}
.nbtn:not(:disabled):hover.primary svg{transform:translateX(4px)}
.nbtn:not(:disabled):hover:not(.primary) svg{transform:translateX(-4px)}
.nbtn:active{transform:scale(.95)}
.dots{display:flex;gap:2px;align-items:center}
.dot{box-sizing:content-box;width:12px;height:12px;padding:6px;background-clip:content-box;border-radius:99px;border:0;background-color:var(--fg);opacity:.85;cursor:pointer;transition:width .35s cubic-bezier(.3,1.5,.5,1),opacity .3s}
.dot.on{width:34px;opacity:1}
.why{
  position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--fg);color:var(--bg);
  padding:22px var(--g) calc(26px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;
  transform:translateY(110%);visibility:hidden;transition:transform .5s cubic-bezier(.2,1,.3,1),visibility 0s .5s;display:flex;gap:20px;align-items:flex-start;justify-content:space-between;
}
.why.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,1,.3,1),visibility 0s}
.why p{margin:0;max-width:52ch;font-size:clamp(1.1rem,2.2vw,1.45rem);font-weight:620;line-height:1.3}
.why .pill{border-color:var(--bg);color:var(--bg);flex:none}
.why .pill:hover{background:var(--bg);color:var(--fg)}
.vizctl{position:absolute;inset:0;pointer-events:none}
.bigslider.ctl{display:none;position:absolute;left:50%;top:var(--top,72%);transform:translate(-50%,-50%);width:min(640px,calc(100% - 2*var(--g)));flex-direction:column;gap:6px;pointer-events:auto}
.bigslider.ctl.show{display:flex;animation:popc .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popc{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%)}}
.bs-top{display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.bs-ends{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;opacity:.85}
.bigslider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;background:transparent;cursor:pointer}
.bigslider input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:rgba(255,255,255,.4)}
.bigslider input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:rgba(255,255,255,.4)}
.bigslider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:40px;height:40px;margin-top:-15px;border-radius:50%;background:var(--acc);border:4px solid var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.bigslider input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--acc);border:4px solid var(--fg);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.qmodal{
  position:absolute;z-index:6;right:var(--g);top:50%;width:min(380px,calc(100% - 2*var(--g)));
  background:var(--fg);color:var(--bg);border-radius:24px;padding:14px 18px 18px;box-shadow:0 18px 50px rgba(0,0,0,.28);
  transform:translate(calc(100% + var(--g) + 40px),-50%);opacity:0;visibility:hidden;
  transition:transform .5s cubic-bezier(.2,1,.3,1),opacity .3s,visibility 0s .5s;
}
.qmodal.show{transform:translate(0,-50%);opacity:1;visibility:visible;transition:transform .55s cubic-bezier(.2,1,.3,1) .15s,opacity .3s .15s,visibility 0s}
.qm-top{display:flex;justify-content:flex-end;margin-bottom:8px}
.qm-btn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border:2px solid var(--bg);border-radius:999px;background:transparent;color:var(--bg);font-weight:700;font-size:.92rem;cursor:pointer;transition:background .15s,color .15s}
.qm-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.qm-btn:hover:not(:disabled){background:var(--bg);color:var(--fg)}
.qm-btn:disabled{opacity:.35;cursor:not-allowed}
.qm-q{margin:0 0 14px;font-size:1.3rem;font-weight:750;line-height:1.22;letter-spacing:-.01em}
.qm-row{display:flex;gap:8px}
.qm-row input{flex:1;min-width:0;height:52px;padding:0 14px;border:2px solid var(--bg);border-radius:14px;background:transparent;color:var(--bg);font:800 1.35rem "Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.qm-row input::placeholder{color:var(--bg);opacity:.45;font-weight:600;font-size:1rem}
.qm-go{height:52px;padding:0 20px;border:0;border-radius:14px;background:var(--bg);color:var(--fg);font-weight:800;font-size:1rem;cursor:pointer}
.qm-go:active{transform:scale(.96)}
.qm-hint{min-height:1.4em;margin-top:10px;font-weight:650;font-size:.95rem}
.qm-done{display:none;align-items:flex-start}
.qm-pad{display:none;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.qk{height:46px;border:0;border-radius:12px;background:rgba(0,0,0,.09);color:var(--bg);font:800 1.3rem "Bricolage Grotesque",system-ui,sans-serif;touch-action:manipulation;cursor:pointer;display:grid;place-items:center;padding:0}
.qk.op{background:rgba(0,0,0,.17)}
.qk.go{background:var(--bg);color:var(--fg);font-size:1rem}
.qk:active{transform:scale(.93)}
@media (max-width:760px){
  .qmodal{position:fixed;top:auto;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto;border-radius:24px 24px 0 0;padding:12px var(--g) 14px;box-shadow:0 -10px 40px rgba(0,0,0,.22);transform:translateY(112%)}
  .qmodal.show{transform:none}
  .stage.qstep .dock{display:none}
  .stage.qstep .nav{margin-top:0;border-radius:0}
  .qm-top{margin-bottom:2px}
  .qm-q{font-size:1.15rem;margin-bottom:10px}
  .qm-row input{height:48px;font-size:1.5rem;text-align:right;caret-color:transparent}
  #qgo{display:none}
  .qm-hint{min-height:1.2em;margin-top:6px;font-size:.88rem}
  .qmodal.hasPad .qm-pad{display:grid}
}
@media (max-width:760px) and (max-height:700px){.qk{height:40px;font-size:1.15rem}.qm-pad{gap:6px;margin-top:6px}.qm-q{font-size:1.05rem;margin-bottom:8px}.qm-row input{height:44px}}
@media (max-width:760px) and (max-height:620px){
  .qmodal{padding-top:10px;padding-bottom:10px}
  .qm-top{position:absolute;top:10px;right:var(--g);margin:0}
  .qm-btn{min-height:32px;padding:0 10px;font-size:.8rem}
  .qm-q{padding-right:128px;min-height:2.5em;margin:0 0 8px;font-size:.98rem}
  .qk{height:36px;font-size:1.05rem}.qm-pad{gap:5px;margin-top:4px}.qm-row input{height:40px}
  .qm-hint:empty{display:none}
}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@media (max-width:560px){.nbtn{padding:0 16px;font-size:1rem;gap:6px}.dots{gap:0}.dot{width:10px;height:10px;padding:7px}.dot.on{width:24px}.nn{display:none}}

/* phones: text hugs the visual; controls + nav sit together in a tray at the bottom */
@media (max-width:760px){
  .stage{padding-bottom:0}
  .stage .dock{display:contents}
  .stage .viz{flex:1 1 0;max-height:calc(54vh*var(--vf,1));max-height:calc(min(54dvh,480px)*var(--vf,1));min-height:200px;overflow:hidden;transition:max-height .35s ease}
  .stage .viz canvas{inset:auto;top:0;left:0;height:calc(100% / var(--vf,1))}
  .stage .capwrap{min-height:0;padding:8px var(--g) 0;margin-bottom:auto}
  .stage .ctls{padding:14px var(--g) 8px;min-height:0;margin-top:14px;background:rgba(0,0,0,.18);border-radius:24px 24px 0 0}
  .stage .ctls.empty{display:none}
  .stage .nav{margin-top:14px;padding:10px var(--g) calc(14px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.18);border-radius:24px 24px 0 0}
  .stage.hasctl .nav{margin-top:0;border-radius:0}
  .capwrap,.ctls{transition:opacity .2s}
  .stage.swap .capwrap,.stage.swap .ctls{opacity:0}
  .stage.qstep .viz{max-height:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-iteration-count:1 !important;animation-duration:.01ms !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important}
}
.sr{position:absolute !important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.stepcount{display:none;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:400px){.nav{gap:6px}.nbtn{padding:0 12px;font-size:.95rem;gap:4px}.dots{display:none}.stepcount{display:block}}
@media (min-width:641px){
  .bigslider.ctl.compact{left:var(--sx,var(--g));transform:translateY(-50%);width:var(--sw,360px)}
  .bigslider.ctl.compact.show{animation:popl .5s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes popl{from{opacity:0;transform:translateY(-50%) scale(.7)}to{opacity:1;transform:translateY(-50%)}}
  .bigslider.compact .bs-top{font-size:.95rem}
  .bigslider.compact .bs-ends{font-size:.8rem}
  .bigslider.compact input[type=range]{height:34px}
  .bigslider.compact input[type=range]::-webkit-slider-runnable-track{height:8px}
  .bigslider.compact input[type=range]::-moz-range-track{height:8px}
  .bigslider.compact input[type=range]::-webkit-slider-thumb{width:28px;height:28px;margin-top:-10px}
  .bigslider.compact input[type=range]::-moz-range-thumb{width:22px;height:22px}
}

/* =====================================================================
   PSYCHEDELIC / LIQUID GLASS
   ===================================================================== */
:root{color-scheme:dark}
html,body{background:#12002e}
body{color:#fff}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;filter:saturate(1.1)}
body.nogl{background:radial-gradient(120% 90% at 18% 8%,#ff4fa3 0,#7a2cff 42%,#12002e 100%)}
.grain{position:fixed;inset:-100px;z-index:200;pointer-events:none;opacity:.22;background-size:160px 160px;animation:grain 1.1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-40px,30px)}40%{transform:translate(35px,-45px)}60%{transform:translate(-25px,-20px)}80%{transform:translate(45px,35px)}100%{transform:translate(0,0)}}

/* white focus ring that reads on glass */
:focus-visible{outline:3px solid rgba(255,255,255,.95);outline-offset:4px}
.qmodal :focus-visible,.why :focus-visible{outline-color:#fff}

/* ---------- home ---------- */
#home{position:relative;z-index:1;transition:opacity .5s ease,transform .6s cubic-bezier(.2,.9,.2,1)}
body.in-stage #home{opacity:0;transform:scale(.96);pointer-events:none}
.homebar h1{font-weight:800;
  
  letter-spacing:-.03em;color:#fff;font-size:clamp(2rem,5.4vw,4.2rem);
  text-shadow:3px 0 0 rgba(255,60,140,.8),-3px 0 0 rgba(0,225,255,.75),0 0 40px rgba(255,255,255,.5);
  animation:aber 7s ease-in-out infinite;
}
@keyframes aber{50%{text-shadow:7px 1px 0 rgba(255,60,140,.8),-7px -1px 0 rgba(0,225,255,.75),0 0 56px rgba(255,255,255,.65)}}

/* ---------- shared glass ---------- */
.pill,.chip,.nbtn,.qm-btn,.eq .m{
  position:relative;color:#fff;border:0;
  background:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,.07) 55%,rgba(255,255,255,.16));
  -webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.2),inset 1px 0 0 rgba(255,255,255,.12),0 8px 24px rgba(20,0,60,.3);
  text-shadow:0 1px 10px rgba(20,0,60,.4);
  transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .25s,box-shadow .25s,color .2s;
}
.pill::before,.chip::before,.nbtn::before,.qm-btn::before,.eq .m::before,.tile::before,.tile .go::before,.qmodal::before,.why::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;

/* ---------- lighter mode for slow devices (switches on automatically) ---------- */

@media (prefers-reduced-motion: reduce){

}

/* =====================================================
   3. SLICE

    draw:function(g,w,h,t,dt){

function tile2(g,w,h,t){

/* =====================================================
   4. STACK
   ===================================================== */
function mkStack(){
  var pal=PAL[3],HC=[pal.fg,pal.acc2,pal.acc,'#8CF0C3'];
  var A=[1,0,0,0,0,0,0,0],a=A.slice(),vis=[1,0,0,0,0,0,0,0];
  var nShow=1,step=0,drag=-1,osc=null,phase=0,spd=0,motionUntil=0,touched=false,holdBtn=null;
  function lay(w,h){
    var mx=gut(w),slot=Math.min(120,(w-2*mx)/nShow);
    return {mx:mx,slot:slot,gx:(w-slot*nShow)/2,wy:h*.2,wh:h*.12,by:h*.4,bh:h*.15,top:h*.62,bot:h*.86};
  }
  function norm(){var s=0;for(var i=0;i<8;i++)s+=a[i];return .3/Math.max(1,s*.9);}
  function startHold(){
    if(osc)return;var c=ac(),o=[],gs=[];
    for(var i=0;i<8;i++){var os=c.createOscillator(),gn=c.createGain();os.frequency.value=130.81*(i+1);gn.gain.value=0;os.connect(gn);gn.connect(master);os.start();o.push(os);gs.push(gn);}
    osc={o:o,g:gs};if(holdBtn)holdBtn.setAttribute('aria-pressed','true');
  }
  function stopHold(){
    if(!osc)return;var c=actx,s=osc;s.g.forEach(function(gn){gn.gain.setTargetAtTime(0,c.currentTime,.03);});
    setTimeout(function(){s.o.forEach(function(o){try{o.stop();}catch(e){}});},250);osc=null;
    if(holdBtn)holdBtn.setAttribute('aria-pressed','false');
  }
  function blip(){
    if(osc)return;var c=ac(),t=c.currentTime+.01,nm=norm();
    motionUntil=performance.now()+900;
    for(var i=0;i<8;i++)if(a[i]>.02)tone(130.81*(i+1),t,.7,{gain:a[i]*nm,attack:.01,release:.4});
  }
  function preset(f){for(var i=0;i<8;i++)A[i]=f(i+1);touched=true;blip();}
  return {
    enter:function(host){
      holdBtn=chip('Hold the note',function(){if(osc)stopHold();else startHold();},0);
      holdBtn.setAttribute('aria-pressed','false');
      host.append(holdBtn,
        chip('Pure',function(){preset(function(n){return n===1?1:0;});},2),
        chip('Hollow',function(){preset(function(n){return n%2?1/n:0;});},2),
        chip('Buzzy',function(){preset(function(n){return 1/n;});},2)
      );
    },
    step:function(s){step=s;nShow=[1,2,8][s];for(var i=nShow;i<8;i++)A[i]=0;},
    draw:function(g,w,h,t,dt){
      var L=lay(w,h),i,k,now=performance.now();
      var want=(osc||drag>=0||now<motionUntil)?1:0;
      spd+=(want-spd)*Math.min(1,dt*5);phase+=dt*1.8*spd;
      for(i=0;i<8;i++){a[i]+=(A[i]-a[i])*Math.min(1,dt*10);vis[i]+=((i<nShow?1:0)-vis[i])*Math.min(1,dt*8);}
      if(osc){var nm=norm();for(i=0;i<8;i++)osc.g[i].gain.setTargetAtTime(a[i]*nm,actx.currentTime,.03);}
      // the sum, on top
      var N=Math.max(120,Math.floor(w/3)),sum=[],peak=1e-6;
      for(i=0;i<=N;i++){var th=TAU*2.2*i/N-phase,s=0;for(k=0;k<8;k++)s+=a[k]*Math.sin((k+1)*th);sum.push(s);peak=Math.max(peak,Math.abs(s));}
      var sc=L.wh/Math.max(1,peak);
      g.strokeStyle=rgba(pal.fg,.2);g.lineWidth=2;g.beginPath();g.moveTo(L.mx,L.wy);g.lineTo(w-L.mx,L.wy);g.stroke();
      g.strokeStyle=pal.acc;g.lineWidth=7;g.lineJoin='round';g.lineCap='round';g.beginPath();
      for(i=0;i<=N;i++){var yy=L.wy-sum[i]*sc,xx=L.mx+i/N*(w-2*L.mx);i?g.lineTo(xx,yy):g.moveTo(xx,yy);}
      g.stroke();

        if(vis[k]<.02)continue;

        g.globalAlpha=vis[k];
        g.strokeStyle=rgba(pal.fg,.25);g.lineWidth=2;g.beginPath();g.moveTo(cx,L.by);g.lineTo(w/2,L.wy+L.wh+14);g.stroke();
        g.fillStyle=rgba(pal.fg,.1);g.beginPath();if(g.roundRect)g.roundRect(cx-bw/2,L.by,bw,L.bh,12);else g.rect(cx-bw/2,L.by,bw,L.bh);g.fill();

        for(var j=0;j<=60;j++){

          j?g.lineTo(px,py):g.moveTo(px,py);
        }
        g.stroke();
        if(k<7&&vis[k+1]>.5)txt(g,'+',cx+L.slot/2,L.by+L.bh/2,24,rgba(pal.fg,.85),'center',800,'middle');
        // bar
        var tw=Math.min(34,L.slot*.4),th2=L.bot-L.top,hh=a[k]*th2;
        g.fillStyle=rgba(pal.fg,.16);g.beginPath();if(g.roundRect)g.roundRect(cx-tw/2,L.top,tw,th2,tw/2);else g.rect(cx-tw/2,L.top,tw,th2);g.fill();
        g.fillStyle=col;
        if(hh>2){g.beginPath();if(g.roundRect)g.roundRect(cx-tw/2,L.bot-hh,tw,hh,tw/2);else g.rect(cx-tw/2,L.bot-hh,tw,hh);g.fill();}
        g.fillStyle=pal.fg;g.beginPath();g.arc(cx,L.bot-hh,tw*.62,0,TAU);g.fill();
        txt(g,(k+1)+'×',cx,L.bot+Math.min(46,h*.095),Math.min(22,L.slot*.34),rgba(pal.fg,.9),'center',800);
        if(step===1&&k===1&&a[1]<.05){
          var r=(t%1.3)/1.3;g.strokeStyle=rgba(pal.acc,1-r);g.lineWidth=3;g.beginPath();g.arc(cx,L.bot-hh,tw*.62+r*34,0,TAU);g.stroke();
        }

      }
      if(step===0&&!touched)txt(g,'tap the wave',w/2,L.wy-L.wh-14,18,rgba(pal.fg,.85),'center',700);
    },
    pointer:function(type,px,py){
      var w=$('#viz')._w,h=$('#viz')._h,L=lay(w,h);
      function setFrom(i){A[i]=clamp((L.bot-py)/(L.bot-L.top),0,1);touched=true;}
      if(type==='down'){
        ac();
        if(py>L.top-40){
          var i=Math.floor((px-L.gx)/L.slot);
          if(i>=0&&i<nShow){drag=i;setFrom(i);}
        }else if(py<L.by){touched=true;blip();}

    },

}
function tile3(g,w,h,t){
  var p=PAL[3],mx=w*.1,Kf=1+(.5+.5*Math.sin(t*.7))*7,N=100;
  g.strokeStyle=p.acc;g.lineWidth=6;g.lineJoin='round';g.lineCap='round';g.beginPath();

/* =====================================================
   5. OCTAVES
   ===================================================== */
function mkOct(){
  var pal=PAL[4],F0=130.81,NN=36,SHARP=[1,3,6,8,10];
  var mix=0,mixT=0,act=-1,last=0,pressed=false,cur=0,hopFrom=0,hopP=1,step=0,flash=0,bub=0,stair=0,sl=null;
  function fr(i){return F0*Math.pow(2,i/12);}
  function lin(i){return (fr(i)-F0)/(fr(NN)-F0);}
  function xp(w,i){var g0=gut(w),mx=g0+(w-2*g0)/74;return mx+lerp(i/NN,lin(i),mix)*(w-2*mx);}
  function edges(w,i){
    var xi=xp(w,i),l=i>0?(xp(w,i-1)+xi)/2:xi-(xp(w,1)-xi)/2,r=i<NN?(xi+xp(w,i+1))/2:xi+(xi-xp(w,NN-1))/2;
    return [l,r];
  }

  }
  return {
    enter:function(host,vz){
      sl=bigSlider('Spacing',0,100,1,0,function(v){mixT=v/100;},1,1,{top:'85%',lo:'Even keys',hi:'Even Hz',fmt:function(v){return v<=0?'even keys':(v>=100?'even hertz':v+' percent of the way to even hertz');}});
      vz.append(sl);
      host.append(chip('One key up  × 1.0595',stepUp,2));
    },
    step:function(s){step=s;if(s===0)mixT=0;if(s===2){mixT=0;if(sl)sl.querySelector('input').value=0;}},
    draw:function(g,w,h,t,dt){
      mix+=(mixT-mix)*Math.min(1,dt*5);stair+=((step===2?1:0)-stair)*Math.min(1,dt*5);
      flash*=Math.exp(-dt*1.6);hopP=Math.min(1,hopP+dt*4);bub*=Math.exp(-dt*1.3);
      var ay=h*.56,kh=Math.min(h*.15,70),yb=h*.86,hmax=h*.4,u=clamp(h/450,.75,1.3),i;
      var sel=step===2?cur:(act>=0?act:-1);
      function topOf(k){return lerp(ay-kh/2,yb-fr(k)/fr(NN)*hmax,stair);}
      // guide lines at each C (steps 3)

        [0,12,24,36].forEach(function(k){

        });

      for(i=0;i<=NN;i++){
        var e=edges(w,i),xw=Math.max(1.4,e[1]-e[0]-(1.6-stair*.6)),xx=e[0]+(e[1]-e[0]-xw)/2;
        var top=topOf(i),bot=lerp(ay+kh/2,yb,stair),sharp=SHARP.indexOf(i%12)>=0,col;
        if(i===sel)col=pal.acc;
        else if(stair>.5)col=(step===2&&i<=cur)?rgba(pal.acc,.85):rgba(pal.fg,.4);
        else col=sharp?'#1B1633':'rgba(255,255,255,.94)';
        g.fillStyle=col;g.fillRect(xx,top,xw,bot-top);
      }
      // octave arcs
      if(stair<.98){
        for(i=0;i<3;i++){
          var xa=xp(w,i*12),xb=xp(w,i*12+12),hgt=Math.min(150,(xb-xa)*.45+16),y0=ay-kh/2-8;
          g.globalAlpha=1-stair;
          g.strokeStyle=pal.acc;g.lineWidth=3.5;g.beginPath();g.moveTo(xa,y0);g.quadraticCurveTo((xa+xb)/2,y0-hgt*1.3,xb,y0);g.stroke();
          txt(g,'× 2',(xa+xb)/2,y0-hgt*.65-12,Math.min(30,Math.max(14,(xb-xa)*.2)),pal.acc,'center',800);
          g.globalAlpha=1;
        }
      }
      // Hz under each C
      [0,12,24,36].forEach(function(k){
        txt(g,Math.round(fr(k))+' Hz',k===0?gut(w):(k===36?w-gut(w):xp(w,k)),lerp(ay+kh/2+Math.min(40,h*.08),yb+Math.min(26,h*.06),stair),Math.min(20,Math.max(12,w*.028)),rgba(pal.fg,.95),(k===0?'left':(k===36?'right':'center')),700);
      });

        g.fillStyle=pal.acc;g.strokeStyle=pal.bg;g.lineWidth=3;g.beginPath();g.arc(mx,my,14,0,TAU);g.fill();g.stroke();
        if(bub>.04){

          txt(g,'× 1.0595',(xp(w,hopFrom)+xp(w,cur))/2,Math.min(topOf(hopFrom),topOf(cur))-52,Math.min(24,w*.04),pal.acc,'center',800);
          g.globalAlpha=1;
        }
      }
      // readout
      var shown=step===2?cur:(act>=0?act:last),f=fr(shown),sz=Math.min(78,h*.15),mxl=gut(w);
      var ftxt=f.toFixed(step===2?1:0);
      txt(g,ftxt,mxl,h*.17,sz,pal.fg,'left',800);
      var wd=g.measureText(ftxt).width;
      txt(g,'Hz',mxl+wd+10,h*.17,sz*.4,rgba(pal.fg,.8),'left',700);
      if(step===2){
        var big=cur>0&&cur%12===0;
        txt(g,big?'× 1.0595¹² = 2':'× 1.0595 per key',mxl,h*.17+sz*.55,Math.min(26,h*.05),big?pal.acc:rgba(pal.fg,.85),'left',800);
      }
      if(step===0&&act<0)txt(g,'slide along the keys',w-mxl,h*.17,Math.min(22,w*.04),rgba(pal.fg,.85),'right',700);
    },
    pointer:function(type,px,py){
      var w=$('#viz')._w;
      function pick(){
        var i=nearest(w,px);
        if(i!==act){
          act=i;last=i;pluck(fr(i),ac().currentTime+.01,1);
          if(step===2){hopFrom=cur;cur=i;hopP=0;}
        }
      }
      if(type==='down'){ac();pressed=true;pick();}
      else if(type==='move'&&pressed){pick();}
      else if(type==='up'){pressed=false;act=-1;}
    },
    leave:function(){}
  };
}

function say(msg){var e=$('#sr');if(!e)return;e.textContent='';clearTimeout(srT);srT=setTimeout(function(){e.textContent=msg;},60);}
function updateControls(){
  Array.prototype.forEach.call(stage.querySelectorAll('.ctl'),function(c){
    var f=+c.getAttribute('data-from')||0,t=c.hasAttribute('data-to')?+c.getAttribute('data-to'):99;
    c.classList.toggle('show',si>=f&&si<=t);
  });
  var nc=host.querySelectorAll('.ctl.show').length;
  host.classList.toggle('empty',nc===0);stage.classList.toggle('hasctl',nc>0);
}
function applyStep(animate){
  var m=META[ci],last=m.steps.length-1;
  var qz=isQ();
  host.style.display=qz?'none':'';
  if(qz)stage.classList.remove('hasctl');
  $('.viz').style.setProperty('--vf',qz?1:(m.steps[si].vf||1));
  $('#vizctl').style.display=qz?'none':'';
  $('#qmodal').classList.toggle('show',qz);
  stage.classList.toggle('qstep',qz);
  if(qz)renderQuiz(animate);else{setCaption(animate);updateControls();}
  Array.prototype.forEach.call($('#dots').children,function(d,i){d.classList.toggle('on',i===si);d.setAttribute('aria-current',i===si?'step':'false');});
  var sc=$('#stepcount');if(sc)sc.innerHTML='<span class="sr">Step </span>'+(si+1)+' of '+m.steps.length;
  $('#prevT').textContent='Back';
  $('#btnPrev').disabled=(ci===0&&si===0);
  $('#nextT').innerHTML=si<last?'Next':(ci<META.length-1?'Next<span class="nn">: '+META[ci+1].name+'</span>':'Menu');
}
function mount(i,s){
  if(cur&&cur.leave)cur.leave();
  ci=i;si=s;var m=META[i];setBgPal(i);
  stage.style.setProperty('--bg',m.pal.bg);stage.style.setProperty('--fg',m.pal.fg);stage.style.setProperty('--acc',m.pal.acc);
  $('#title').textContent=m.name;stage.setAttribute('aria-label',m.name);document.title=m.name+' · '+BASE_TITLE;
  host.innerHTML='';$('#vizctl').innerHTML='';cur=m.make();cur.enter(host,$('#vizctl'));
  var dots=$('#dots');dots.innerHTML='';
  m.steps.forEach(function(_,k){
    var d=el('button',{type:'button','class':'dot','aria-label':'Step '+(k+1)});
    d.addEventListener('click',function(){setStep(k);});dots.append(d);
  });
  $('#whyText').textContent=m.why;
  // run steps up to s so state is consistent
  var realN=m.steps.length-(m.quiz?1:0);
  for(var k=0;k<=Math.min(s,realN-1);k++)cur.step(k);
  if(s>=realN&&cur.leave)cur.leave();
  $('#qin').value='';
  applyStep(true);
  $('#why').classList.remove('open');$('#btnWhy').setAttribute('aria-expanded','false');
}
function setStep(s){
  if(s===si)return;
  var m=META[ci],qIdx=m.quiz?m.steps.length-1:-1;
  if(isQ()){mount(ci,s);return;}
  if(s===qIdx){si=s;if(cur.leave)cur.leave();applyStep(true);return;}
  var dir=s>si;
  if(dir){for(var k=si+1;k<=s;k++)cur.step(k);}else{cur.step(s);}
  si=s;applyStep(true);
}
function go(dir){
  var last=META[ci].steps.length-1;
  if(dir>0){
    if(si<last)setStep(si+1);
    else if(ci<META.length-1)swapTo(ci+1,0);
    else goHome();
  }else{
    if(si>0)setStep(si-1);
    else if(ci>0)swapTo(ci-1,META[ci-1].steps.length-1);
  }
}
function swapTo(i,s){
  stage.classList.add('swap');
  setTimeout(function(){mount(i,s);stage.classList.remove('swap');},220);
}
function openStage(i,s,tileEl){
  ac();
  lastTile=tileEl;
  var r=tileEl.getBoundingClientRect();
  stage.style.setProperty('--cx',(r.left+r.width/2)+'px');stage.style.setProperty('--cy',(r.top+r.height/2)+'px');
  mount(i,s);
  stage.classList.add('open');stage.setAttribute('aria-hidden','false');
  document.body.classList.add('noscroll');document.body.classList.add('in-stage');
  setTimeout(function(){if(stage.classList.contains('open')&&ci>=0)stage.classList.add('settled');},800);
  try{$('#home').inert=true;}catch(e){}
  setTimeout(function(){$('#btnNext').focus({preventScroll:true});},60);
}
function goHome(){
  if(cur&&cur.leave)cur.leave();
  cur=null;ci=-1;
  if(lastTile){
    var r=lastTile.getBoundingClientRect();
    stage.style.setProperty('--cx',(r.left+r.width/2)+'px');stage.style.setProperty('--cy',(r.top+r.height/2)+'px');
  }
  stage.classList.remove('settled');void stage.offsetWidth;
  stage.classList.remove('open');stage.setAttribute('aria-hidden','true');
  document.body.classList.remove('noscroll');document.body.classList.remove('in-stage');setBgPal(-1);
  try{$('#home').inert=false;}catch(e){}
  document.title=BASE_TITLE;
  if(lastTile)lastTile.focus({preventScroll:true});
}
$('#btnHome').addEventListener('click',goHome);
$('#btnPrev').addEventListener('click',function(){go(-1);});
$('#btnNext').addEventListener('click',function(){go(1);});
$('#btnMute').addEventListener('click',function(){setMuted(!muted);});
function closeWhy(){
  var w=$('#why');if(!w.classList.contains('open'))return;
  w.classList.remove('open');$('#btnWhy').setAttribute('aria-expanded','false');$('#btnWhy').focus({preventScroll:true});
}
$('#btnWhy').addEventListener('click',function(){
  if($('#why').classList.contains('open')){closeWhy();return;}
  $('#why').classList.add('open');$('#btnWhy').setAttribute('aria-expanded','true');
  setTimeout(function(){$('#whyClose').focus({preventScroll:true});},80);
});
$('#whyClose').addEventListener('click',closeWhy);
document.addEventListener('keydown',function(e){
  if(ci<0)return;
  if(e.target&&e.target.tagName==='INPUT'&&e.key!=='Escape')return;
  if(e.key==='ArrowRight'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(e.key==='Escape'){
    if($('#why').classList.contains('open')){closeWhy();}else goHome();
  }
});

/* ---------- quiz logic ---------- */
function isQ(){return ci>=0&&!!META[ci].quiz&&si===META[ci].steps.length-1;}
function doneCount(z){var c=0;z.done.forEach(function(d){if(d)c++;});return c;}
function setEq(m,a){$('#eq').innerHTML='<span class="m"><i class="ic" aria-hidden="true">♪</i><span class="sr">Music: </span>'+m+'</span><span class="sep">=</span><span class="a"><i class="ic" aria-hidden="true">∑</i><span class="sr">Math: </span>'+a+'</span>';}
function updEq(m,a){var em=$('#eq .m'),ea=$('#eq .a');if(!em||!ea){setEq(m,a);return;}em.innerHTML='<i class="ic" aria-hidden="true">♪</i><span class="sr">Music: </span>'+m;ea.innerHTML='<i class="ic" aria-hidden="true">∑</i><span class="sr">Math: </span>'+a;}
function evalMath(src){
  var s=String(src).replace(/[×xX·]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/\s+/g,'');
  if(!s||!/^[0-9+\-*\/().]+$/.test(s))return null;
  var p=0;
  function peek(){return s[p];}
  function num(){var m=/^(\d+\.?\d*|\.\d+)/.exec(s.slice(p));if(!m)throw 0;p+=m[0].length;return parseFloat(m[0]);}
  function atom(){var c=peek();if(c==='('){p++;var v=expr();if(peek()!==')')throw 0;p++;return v;}if(c==='-'){p++;return -atom();}if(c==='+'){p++;return atom();}return num();}
  function term(){var v=atom();while(peek()==='*'||peek()==='/'){var o=s[p++],r=atom();v=o==='*'?v*r:v/r;}return v;}
  function expr(){var v=term();while(peek()==='+'||peek()==='-'){var o=s[p++],r=term();v=o==='+'?v+r:v-r;}return v;}
  try{var v=expr();if(p!==s.length||!isFinite(v))return null;return v;}catch(e){return null;}
}
function playItem(it,when){
  var c=ac(),t=when||c.currentTime+.02;
  if(it.f2){tone(it.f,t,.7,{gain:.14});tone(it.f2,t,.7,{gain:.14});}
  else pluck(it.f,t,1.1,.3);
}
function playSong(){
  var q=META[ci].quiz,z=QS[ci],c=ac(),t0=c.currentTime+.08,L=q.loop||3.2;
  z.play={t0:t0,L:L};z.prev=null;
  if(q.anchor)playItem(q.anchor,t0);
  q.items.forEach(function(it,i){if(z.done[i])playItem(it,t0+it.ph*L);});
  setTimeout(function(){if(z.play&&z.play.t0===t0)z.play=null;},(L+.5)*1000);
}
function renderQuiz(animate){
  var q=META[ci].quiz,z=QS[ci],n=q.items.length,cnt=doneCount(z),fin=cnt>=n;
  capEl.textContent=fin?'You made music with math.':'Do the math. Make the music.';
  setEq(fin?'Your '+q.what.toLowerCase():q.what,fin?n+' answers':cnt+' of '+n+' solved');
  $('#qq').textContent=fin?'All '+n+' notes are in.':q.items[z.i].q;
  $('#qrow').style.display=fin?'none':'flex';
  $('#qdone').style.display=fin?'flex':'none';
  $('#qhint').textContent='';
  $('#qagain').disabled=cnt===0;
  if(animate)say(fin?'All '+n+' notes are in. Use Play again to hear your song, or Start over.':'Question '+(z.i+1)+' of '+n+'. '+q.items[z.i].q);
  var nw=!!(window.matchMedia&&matchMedia('(max-width:760px)').matches),qi=$('#qin');
  qi.readOnly=nw;qi.setAttribute('inputmode',nw?'none':'text');qi.placeholder=nw?'Your answer':'Type your answer';
  $('#qmodal').classList.toggle('hasPad',nw&&!fin);
  if(animate){capEl.classList.remove('in');void capEl.offsetWidth;capEl.classList.add('in');}
}
function shakeInput(){var i=$('#qin');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');}
function submitAnswer(){
  if(!isQ())return;
  var q=META[ci].quiz,z=QS[ci],n=q.items.length,it=q.items[z.i];
  if(z.lock||doneCount(z)>=n)return;
  var v=evalMath($('#qin').value);
  if(v===null){$('#qhint').textContent='Type a number or a sum, like 3/2 × 220.';shakeInput();return;}
  var tol=it.tol==null?.011:it.tol;
  var ok=Math.abs(v-it.ans)<=tol||(it.alt&&it.alt.some(function(a){return Math.abs(v-a)<.011;}));
  if(ok){
    z.done[z.i]=true;z.flash[z.i]=1;z.anim[z.i]=0;z.tries=0;z.lock=true;playItem(it);say('Correct. '+it.show+'.');
    $('#qin').value='';$('#qhint').textContent='';
    var nx=-1;for(var k=1;k<=n;k++){var j=(z.i+k)%n;if(!z.done[j]){nx=j;break;}}
    var cidx=ci;
    setTimeout(function(){
      z.lock=false;if(nx>=0)z.i=nx;
      if(ci===cidx&&isQ()){renderQuiz(true);if(nx<0)setTimeout(function(){if(ci===cidx&&isQ())playSong();},500);}
    },800);
  }else{
    z.tries++;shakeInput();tone(160,ac().currentTime,.18,{type:'triangle',gain:.12,release:.1});
    $('#qhint').textContent=z.tries===1?it.hint:'The answer is '+it.show+'. Type it in.';
  }
}
function resetQuiz(){var z=QS[ci];z.i=0;z.done=[];z.anim=[];z.flash=[];z.tries=0;z.lock=false;z.play=null;renderQuiz(true);}
function quizDraw(g,w,h,t,dt){
  var m=META[ci],pal=m.pal,q=m.quiz,z=QS[ci],n=q.items.length,cnt=doneCount(z),fin=cnt>=n;
  var narrow=w<=760,g0=gut(w),mw=Math.min(380,w-2*g0),left=w-g0-mw-24;
  var cx,cy,R=0,r,P,rowY=0;
  if(narrow){
    // phones: progress dots in a row, in the space above the keypad sheet
    var mq=$('#qmodal'),sr=stage.getBoundingClientRect(),cr=$('#viz').getBoundingClientRect(),bt=parseFloat(getComputedStyle(mq).bottom)||0;
    var availH=clamp(sr.bottom-bt-mq.offsetHeight-cr.top-4,44,h);
    r=clamp(availH*.27,12,30);rowY=availH*.5;cx=w/2;cy=rowY;
    var span=(w-2*g0-2*r)/.92;
    P=function(ph){return [g0+r+ph*span,rowY];};
  }else{
    cx=left/2;cy=h*.5;R=Math.min(left*.36,h*.36);r=Math.min(34,R*.24);
    P=function(ph){var a=-Math.PI/2+ph*TAU;return [cx+R*Math.cos(a),cy+R*Math.sin(a)];};
  }
  QG={P:P,r:r};
  g.strokeStyle=rgba(pal.fg,.28);g.lineWidth=3;g.lineCap='round';g.beginPath();
  if(narrow){g.moveTo(g0,rowY);g.lineTo(w-g0,rowY);}else{g.arc(cx,cy,R,0,TAU);}
  g.stroke();
  var head=null;
  if(z.play&&actx){var p=(actx.currentTime-z.play.t0)/z.play.L;if(p>=0&&p<=1)head=p;}
  if(q.anchor){
    var ap=P(0);
    g.fillStyle=rgba(pal.fg,.55);g.beginPath();g.arc(ap[0],ap[1],r*.8,0,TAU);g.fill();
    txt(g,q.anchor.label,ap[0],ap[1],Math.max(9,r*.38),pal.bg,'center',800,'middle');
  }
  q.items.forEach(function(it,i){
    var d=!!z.done[i];
    z.flash[i]=(z.flash[i]||0)*Math.exp(-dt*3);
    if(d){z.anim[i]=Math.min(1,(z.anim[i]||0)+dt*2.5);}
    var ph=d?lerp(it.gh,it.ph,ease(z.anim[i]||0)):it.gh;
    if(d&&head!==null&&z.prev!==null&&z.prev<it.ph&&head>=it.ph)z.flash[i]=1;
    var pp=P(ph),px=pp[0],py=pp[1],f=z.flash[i];
    if(d){
      g.fillStyle=pal.fg;g.beginPath();g.arc(px,py,r*(1+f*.35),0,TAU);g.fill();
      if(f>.05){g.strokeStyle=rgba(pal.acc2,f);g.lineWidth=4;g.beginPath();g.arc(px,py,r*(1.3+(1-f)*.7),0,TAU);g.stroke();}
      txt(g,it.label,px,py,Math.max(11,Math.min(19,r*.58)),pal.bg,'center',800,'middle');
    }else{
      g.strokeStyle=rgba(pal.fg,.55);g.lineWidth=2.5;g.setLineDash([6,6]);g.beginPath();g.arc(px,py,r*.85,0,TAU);g.stroke();g.setLineDash([]);
      txt(g,String(i+1),px,py,Math.max(12,r*.6),rgba(pal.fg,.7),'center',800,'middle');
      if(i===z.i&&!fin){var k=(t%1.3)/1.3;g.strokeStyle=rgba(pal.acc,1-k);g.lineWidth=3;g.beginPath();g.arc(px,py,r*.85+k*r*.9,0,TAU);g.stroke();}
    }
  });
  z.prev=head;
  if(head!==null){
    g.strokeStyle=pal.fg;g.lineWidth=5;g.lineCap='round';g.beginPath();
    if(narrow){var hp=P(head);g.moveTo(hp[0],rowY-r*1.5);g.lineTo(hp[0],rowY+r*1.5);}
    else{var ha=-Math.PI/2+head*TAU;g.moveTo(cx+R*.2*Math.cos(ha),cy+R*.2*Math.sin(ha));g.lineTo(cx+(R+r*1.1)*Math.cos(ha),cy+(R+r*1.1)*Math.sin(ha));}
    g.stroke();
  }
  if(!narrow)txt(g,fin?'♪':cnt+'/'+n,cx,cy+(fin?Math.sin(t*3)*4:0),R*.5,pal.fg,'center',800,'middle');
}
function quizPointer(px,py){
  var q=META[ci].quiz,z=QS[ci];
  q.items.forEach(function(it,i){
    if(!z.done[i])return;
    var pp=QG.P(it.ph);
    if(Math.hypot(px-pp[0],py-pp[1])<QG.r*1.4)playItem(it);
  });
}
/* math keypad (phones) */
(function(){
  var KEYS=[['7','8','9','(',')'],['4','5','6','×','÷'],['1','2','3','+','−'],['0','.','C','⌫','Check']];
  var NAME={'×':'times','÷':'divided by','−':'minus','+':'plus','C':'clear','⌫':'backspace','(':'open bracket',')':'close bracket','.':'point','Check':'Check answer'};
  KEYS.forEach(function(row){row.forEach(function(k){
    var b=el('button',{type:'button','class':'qk'+(k==='Check'?' go':(/[0-9.]/.test(k)?'':' op')),'aria-label':NAME[k]||k});
    b.textContent=k;
    b.addEventListener('click',function(){
      var i=$('#qin');
      if(k==='Check'){submitAnswer();return;}
      if(k==='C')i.value='';else if(k==='⌫')i.value=i.value.slice(0,-1);else i.value+=k;
    });
    $('#qpad').append(b);
  });});
  window.addEventListener('resize',function(){if(ci>=0&&isQ())renderQuiz(false);});
})();
$('#qgo').addEventListener('click',submitAnswer);
$('#qin').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitAnswer();}});
$('#qagain').addEventListener('click',playSong);
$('#qreset').addEventListener('click',resetQuiz);

/* canvas pointer */
function pos(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
cv.addEventListener('pointerdown',function(e){
  if(!cur)return;
  var p=pos(e);
  if(isQ()){quizPointer(p[0],p[1]);return;}
  try{cv.setPointerCapture(e.pointerId);}catch(x){}
  cur.pointer('down',p[0],p[1]);
});
cv.addEventListener('pointermove',function(e){if(!cur||isQ())return;var p=pos(e);cur.pointer('move',p[0],p[1]);});
cv.addEventListener('pointerup',function(e){if(!cur||isQ())return;var p=pos(e);cur.pointer('up',p[0],p[1]);});
cv.addEventListener('pointercancel',function(e){if(!cur||isQ())return;var p=pos(e);cur.pointer('up',p[0],p[1]);});

/* ---------- main loop ---------- */
var lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  drawBG(dt);perfTick(now);
  if(ci>=0&&cur){
    var f=fit(cv);
    if(f){f.g.clearRect(0,0,f.w,f.h);if(isQ())quizDraw(f.g,f.w,f.h,now/1000,dt);else cur.draw(f.g,f.w,f.h,now/1000,dt);}
  }
  tiles.forEach(function(tl){
    tl.hv+=(tl.hvT-tl.hv)*Math.min(1,dt*8);
    if(!RM)tl.tt+=dt*(1+tl.hv*1.8);
    var f2=fit(tl.cv);
    if(f2){f2.g.clearRect(0,0,f2.w,f2.h);tl.m.tile(f2.g,f2.w,f2.h,tl.tt,tl.hv);}
  });
}

/* boot */
initBG();setBgPal(-1);
setMuted(muted);
requestAnimationFrame(frame);
})();
</script>
